<app-data-list-card
  title="Últimos Movimientos"
  [linkText]="movimientos().length > 0 ? 'Ver todos' : ''"
  (linkClicked)="verTodos.emit()"
>
  @if (rows().length === 0) {
    <div class="movimientos-empty">Sin movimientos recientes</div>
  } @else {
    @for (row of rows(); track row.id) {
      <app-data-list-item
        [icon]="row.icon"
        [iconVariant]="row.iconVariant"
        [primaryText]="row.primaryText"
        [secondaryText]="row.secondaryText"
        [value]="row.signedMonto"
        valueVariant="auto"
      />
    }
  }
</app-data-list-card>
