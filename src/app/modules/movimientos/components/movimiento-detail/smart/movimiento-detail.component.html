<div class="detail-container">
  <header class="header">
    <button mat-icon-button (click)="onBack()">
      <mat-icon>arrow_back</mat-icon>
    </button>
    <h1>Detalle del Movimiento</h1>
    <div class="actions">
      <app-button variant="secondary" icon="edit" (clicked)="onEdit()" [disabled]="!movimiento()">
        Editar
      </app-button>
      <app-button variant="danger" icon="delete" (clicked)="onDelete()" [disabled]="!movimiento()">
        Eliminar
      </app-button>
    </div>
  </header>

  <!-- Loading State -->
  <div *ngIf="loading()" class="loading-container">
    <mat-spinner diameter="40"></mat-spinner>
    <p>Cargando movimiento...</p>
  </div>

  <!-- Error State (only when no data loaded yet) -->
  <div *ngIf="error() && !loading() && !movimiento()" class="error-container">
    <mat-icon color="warn">error</mat-icon>
    <p>{{ error() }}</p>
    <app-button variant="secondary" (clicked)="onBack()">Volver</app-button>
  </div>

  <!-- Data State -->
  <app-movimiento-info-card
    *ngIf="movimiento() && !loading()"
    [movimiento]="movimiento()!">
  </app-movimiento-info-card>
</div>
